[package]
name = "tusk"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
gpui-kit = { version = "0.6", features = ["tree-sitter-sql"] }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", features = ["postgres", "mysql", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"
lsp-types = { version = "0.97", features = ["proposed"] }
russh = "0.63"
# Embedded engines / clients for the other databases.
duckdb = { version = "1", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hmac = "0.12"
sha2 = "0.10"
flate2 = "1"
hex = "0.4"
base64 = "0.22"
jsonwebtoken = "9"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
redis = { version = "0.32", features = ["tokio-comp", "aio", "connection-manager"] }
mongodb = "3.9.1"
scylla = "1.9.0"
async-trait = "0.1.92"
oracle-rs = "0.1.7"
rsa = { version = "0.9", features = ["pem", "getrandom"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
serde_norway = "0.9"

# Local patch of gpui-component 0.6.6: Zed-style LSP completion rows
# (kind glyph, kind-colored label, bold match, non-italic detail).
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
# Inline Markdown code at the text size (see vendor/gpui-base, "Tusk patch").
gpui-base = { path = "vendor/gpui-base" }
# Don't swap a closing window's content view back to its original class under
# AppKit's KVO; it aborted on macOS 14 (see vendor/accesskit_macos, "Tusk patch").
accesskit_macos = { path = "vendor/accesskit_macos" }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSProcessInfo", "NSString", "NSObject"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# The Windows exe's icon (assets/windows/tusk.ico) and version info.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
